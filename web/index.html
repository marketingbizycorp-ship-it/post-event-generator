<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeakUp — Soft Skills & Professional Speaking</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎙️</span>
      <div>
        <h1>SpeakUp</h1>
        <p class="tagline">Practise professional English speaking & soft skills</p>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="speaking">Speaking</button>
      <button class="tab" data-view="vocab">Vocabulary</button>
      <button class="tab" data-view="conversation">Conversation</button>
      <button class="tab" data-view="progress">Progress</button>
    </nav>
  </header>

  <main id="app">
    <!-- Views are rendered here by app.js -->
  </main>

  <footer class="foot">
    <span>Runs entirely in your browser — your speech never leaves your device.</span>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/analyzer.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
